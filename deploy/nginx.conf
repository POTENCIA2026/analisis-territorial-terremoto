# nginx del contenedor del tablero: solo sirve archivos estáticos ya generados. Corre sin privilegios
# y no comprime al vuelo: index.html se publica ya comprimido (index.html.gz) y gzip_static lo entrega.
worker_processes 1;
pid /tmp/nginx/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 512; }

http {
    include /etc/nginx/mime.types;
    types {
        text/plain md;
        text/csv csv;
    }
    default_type application/octet-stream;
    charset utf-8;
    charset_types text/plain text/csv application/json;

    # Sin escritura fuera de /tmp (el sistema de archivos del contenedor es de solo lectura).
    client_body_temp_path /tmp/nginx/body;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;

    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    gzip off;
    gzip_static on;
    gzip_vary on;

    server {
        listen 8080 default_server;
        server_name _;
        root /data/public;

        # Respuesta viva del proceso (el estado de los datos está en /status.json).
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /status.json {
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # Archivos que el propio tablero enlaza con rutas relativas (fuentes y guías).
        location ^~ /data/ {
            alias /app/data/;
            autoindex off;
            add_header Cache-Control "public, max-age=3600" always;
            add_header X-Content-Type-Options "nosniff" always;
        }
        location ^~ /docs/ {
            alias /app/docs/;
            autoindex off;
            add_header Cache-Control "public, max-age=3600" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # La página: sin caché sin revalidar (cambia cada pocas horas). Su política de seguridad la fija
        # el propio contenedor: es un solo archivo con scripts y estilos en línea, sin ninguna petición de
        # red, así que se prohíbe todo lo demás. Solo puede enmarcarla su mismo origen (Torre de Control).
        location = / {
            rewrite ^ /index.html last;   # reingresa para que apliquen las cabeceras de abajo
        }
        location ~ ^/(index|eda_indicadores)\.html$ {
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'" always;
        }

        location / {
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri =404;
        }
    }
}
