# Tablero territorial del terremoto en el mismo servidor que Torre de Control.
#   docker compose up -d --build
# Solo escucha en 127.0.0.1: el Nginx del servidor lo publica bajo /tablero-terremoto/
# (ver docs/despliegue_torre_de_control.md). Cambia solo el número de la izquierda si 8002 está ocupado.
services:
  tablero:
    build: .
    image: tablero-terremoto:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8002:8080"
    environment:
      UPDATE_INTERVAL_HOURS: "4"
    volumes:
      - tablero_data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  tablero_data:
