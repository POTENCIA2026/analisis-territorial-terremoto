name: Preparar escenario REPS y SIMAT
on:
  push:
    branches: [relativo-reps-simat-sin-comunitarios]
    paths:
      - '.github/workflows/reps-simat.yml'
      - 'scripts/inspeccionar_simat.py'
permissions:
  contents: write
concurrency:
  group: reps-simat-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  preparar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verificar fuentes educativas
        run: python scripts/inspeccionar_simat.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          branch: ${{ github.ref_name }}
          commit_message: 'Registrar inspección de fuentes educativas'
          file_pattern: 'data/simat_source_probe.json'
